esphome:
  name: wireless-speaker
  friendly_name: Wireless Speaker
  # Set volume to 15% on boot
  on_boot:
    priority: -100 # Run after initialization
    then:
      - speaker.volume_set: 
          id: wireless_speaker
          volume: 0.15

esp32:
  board: esp32dev

# Enable logging. Default is DEBUG
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Enable wireless connectivity to the network
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The local network is not .local
  domain: ".home.arpa"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Wireless-Speaker"
    password: !secret wifi_ap_password

captive_portal:

# Enable the ESP32 local webserver
web_server:
  port: 80

i2s_audio: 
  id: dac_connect
  i2s_lrclk_pin: GPIO27  # Pin for Left/Right Clock 
  i2s_bclk_pin: GPIO25  # Pin for Bit Clock 

speaker: 
  - platform: i2s_audio  # Defines a media player using I2S audio  
    dac_type: external  # Specifies that an external DAC is used 
    i2s_dout_pin: GPIO26  # Pin for Data Out 
    i2s_audio_id: dac_connect
    id: wireless_speaker # The ID of the media player
    channel: stereo
  - platform: mixer
    id: wireless_speaker_mixer_id
    output_speaker: wireless_speaker
    source_speakers: 
      - id: wireless_announcement_mixer_input
      - id: wireless_media_mixer_input
  - platform: resampler
    id: wireless_media_resampler_input
    output_speaker: wireless_media_mixer_input
  - platform: resampler
    id: wireless_announcement_resampler_input
    output_speaker: wireless_announcement_mixer_input

# Media Player
media_player:
  - platform: speaker
    name: "Player Speaker"
    id: player_speaker_id
    media_pipeline: 
      speaker: wireless_media_resampler_input
      num_channels: 2
    announcement_pipeline: 
      speaker: wireless_announcement_resampler_input
      num_channels: 1

# Reset button
button:
  - platform: restart
    name: "Restart ESP"
    id: restart_button

# Binary sensors for the volume up and down buttons.
binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO18
      mode: 
        input: true
        pullup: true
    name: "Volume Down Button"
    id: volume_down_button
    on_press:
      then:
          - media_player.volume_down: player_speaker_id  
         
  - platform: gpio
    pin: 
      number: GPIO19
      mode: 
        input: true
        pullup: true
    name: "Volume Up Button"
    id: volume_up_button
    on_press:
      then:
        - media_player.volume_up: player_speaker_id   
